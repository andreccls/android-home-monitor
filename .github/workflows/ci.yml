name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships the Android SDK (platform 37 is installed on demand by AGP if licenses are accepted).
      - name: Lint (ktlint + Android Lint)
        run: ./gradlew ktlintCheck :app:lintDebug
      - name: Unit tests and coverage gate
        run: ./gradlew :app:testDebugUnitTest :app:koverVerify
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
      # Instrumented tests are NOT run here: they need an emulator (hardware acceleration + several minutes
      # of boot on hosted runners), which makes the pipeline slow and flaky. Run `make instrumented` locally.
